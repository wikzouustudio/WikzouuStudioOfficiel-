<style>
/* Layout: iOS-style grouped lists in a 680px column, large titles, bottom tab bar with blur */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fg:#1C1C1E; --fg2:#6C6C70; --fg3:#AEAEB2;
  --sep:rgba(60,60,67,.16); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --accent:#B9661F; --accent-soft:rgba(185,102,31,.12);
  --orange:#FF9500; --green:#34C759; --pink:#FF2D55; --teal:#30B0C7; --purple:#AF52DE; --gray:#8E8E93; --red:#FF3B30; --blue:#007AFF;
  --bar:rgba(249,249,251,.84); --shadow:0 1px 0 rgba(0,0,0,.03);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-r:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fg:#F2F2F7; --fg2:#98989F; --fg3:#5A5A5F;
  --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.32);
  --accent:#E8954A; --accent-soft:rgba(232,149,74,.16);
  --orange:#FF9F0A; --green:#30D158; --pink:#FF375F; --teal:#40C8E0; --purple:#BF5AF2; --gray:#8E8E93; --red:#FF453A; --blue:#0A84FF;
  --bar:rgba(22,22,24,.84); --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fg:#F2F2F7; --fg2:#98989F; --fg3:#5A5A5F;
  --sep:rgba(84,84,88,.55); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.32);
  --accent:#E8954A; --accent-soft:rgba(232,149,74,.16);
  --orange:#FF9F0A; --green:#30D158; --pink:#FF375F; --teal:#40C8E0; --purple:#BF5AF2; --gray:#8E8E93; --red:#FF453A; --blue:#0A84FF;
  --bar:rgba(22,22,24,.84); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:680px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:20px;margin-bottom:14px}
.eyebrow{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em}
h1{font-family:var(--font-d);font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:2px 0 0;text-wrap:balance}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;
  font-weight:700;font-size:18px;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:96px;height:96px;font-size:38px}

/* Sections */
.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 4px 8px}
.sec-h h2{font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.sec-h .link{color:var(--accent);font-size:16px;font-weight:500}
.foot{font-size:13px;color:var(--fg2);margin:8px 16px 0}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pad{padding:16px}
.list>.row+.row{border-top:.5px solid var(--sep)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;width:100%;text-align:left}
.row .main{flex:1;min-width:0}
.row .t{font-size:16px;font-weight:500}
.row .s{font-size:13px;color:var(--fg2);margin-top:2px;overflow-wrap:anywhere}
.row .val{color:var(--fg2);text-align:right;font-size:15px;overflow-wrap:anywhere}
.chev{color:var(--fg3);flex:none}
button.row:active{background:var(--fill)}

/* Week strip */
.week{display:flex;align-items:center;gap:4px}
.week .nav{width:28px;height:44px;color:var(--accent);display:grid;place-items:center;flex:none;border-radius:8px}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dayb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:12px}
.dayb .l{font-size:11px;font-weight:600;color:var(--fg2);text-transform:uppercase}
.dayb .n{font-size:17px;font-weight:600;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;position:relative}
.dayb .n svg{position:absolute;inset:0}
.dayb.today .n{color:var(--accent)}
.dayb.sel .n{background:var(--fg);color:var(--bg)}
.dayb.sel.today .n{background:var(--accent);color:#fff}

/* Summary */
.sum{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring-txt{font-family:var(--font-r);font-size:28px;font-weight:700;line-height:1}
.ring-sub{font-size:13px;color:var(--fg2);margin-top:4px}
.next{margin-top:10px;font-size:15px}
.next b{font-weight:600}
.catstats{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--fill)}
.pill i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* Alerts */
.alerts{display:grid;gap:8px;margin-top:12px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow)}
.alert .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.alert .main{flex:1;min-width:0;font-size:15px}
.alert .main small{display:block;color:var(--fg2);font-size:13px}

/* Timeline */
.period{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;margin:18px 16px 6px}
.task{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;min-height:60px}
.task+.task{border-top:.5px solid var(--sep)}
.task .time{width:46px;font-size:15px;font-weight:600;flex:none}
.task .time.late{color:var(--red)}
.ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.ico svg{width:18px;height:18px}
.task .main{flex:1;min-width:0}
.task .t{font-weight:500}
.task.done .t{color:var(--fg2);text-decoration:line-through;text-decoration-color:var(--fg3)}
.task .s{font-size:13px;color:var(--fg2);margin-top:1px;overflow-wrap:anywhere}
.task .s .ok{color:var(--green);font-weight:600}
.check{width:44px;height:44px;display:grid;place-items:center;flex:none;border-radius:50%}
.check span{width:26px;height:26px;border-radius:50%;border:2px solid var(--fg3);display:grid;place-items:center;transition:transform .15s}
.check.on span{background:var(--green);border-color:var(--green);color:#fff}
.check:active span{transform:scale(.88)}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:7px 4px;border-radius:7px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.jrow{display:grid;grid-template-columns:90px 1fr;gap:12px;align-items:center;padding:10px 16px}
.jrow+.jrow{border-top:.5px solid var(--sep)}
.jrow label{font-size:15px}
textarea.note{width:100%;min-height:84px;border:0;background:transparent;resize:vertical;padding:12px 16px;font-size:15px;line-height:1.45;border-top:.5px solid var(--sep)}
textarea.note:focus{outline:none}

/* Meds */
.med{padding:14px 16px}
.med+.med{border-top:.5px solid var(--sep)}
.med-h{display:flex;gap:12px;align-items:center}
.med-h .main{flex:1;min-width:0}
.med-h .t{font-size:17px;font-weight:600}
.med-h .s{font-size:14px;color:var(--fg2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:13px;font-weight:600;padding:4px 9px;border-radius:7px;background:var(--fill);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:3px}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--fg2);margin-top:6px;flex-wrap:wrap}

/* Charts */
.chart{width:100%;height:auto;display:block}
.big{font-family:var(--font-r);font-size:30px;font-weight:700;line-height:1}
.big small{font-size:15px;color:var(--fg2);font-weight:600;margin-left:3px}

/* Inputs */
.inl{display:flex;gap:8px;padding:12px 16px;border-top:.5px solid var(--sep);flex-wrap:wrap}
.inl input{flex:1;min-width:110px}
input.f,select.f,textarea.f{width:100%;background:var(--fill);border:0;border-radius:10px;padding:10px 12px;font-size:16px;min-height:42px}
textarea.f{min-height:80px;resize:vertical}
.btn{background:var(--accent);color:#fff;font-weight:600;border-radius:10px;padding:10px 16px;min-height:42px}
.btn.ghost{background:var(--fill);color:var(--accent)}
.btn.danger{background:transparent;color:var(--red)}
.pinput{flex:1;min-width:0;text-align:right;background:transparent;border:0;font-size:15px;color:var(--fg)}
.pinput:focus{outline:none}
.pinput::placeholder{color:var(--fg3)}

/* Profile hero */
.hero{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:28px}
.hero h1{font-size:30px}
.hero .s{color:var(--fg2);font-size:15px}
.copy{color:var(--accent);font-size:14px;font-weight:600;padding:6px 8px;border-radius:8px;flex:none}

/* Banner */
.banner{margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);font-size:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1;min-width:200px}
.banner button{color:var(--accent);font-weight:600}

/* Tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--sep);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--gray);font-size:10.5px;font-weight:500;padding:4px 0;min-height:48px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--accent)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.36);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px;z-index:1}
.sheet-h b{font-size:17px;font-weight:600}
.sheet-h button{color:var(--accent);font-size:17px;min-width:70px;min-height:36px}
.sheet-h .save{font-weight:600;text-align:right}
.sheet-h .cancel{text-align:left}
.fg{display:grid;gap:6px;margin-bottom:14px}
.fg>label,.fg>.lab{font-size:13px;color:var(--fg2);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-left:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;pointer-events:none}
.opts span{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--fill);font-size:14px;font-weight:500;cursor:pointer}
.opts input:checked+span{background:var(--accent);color:#fff}
.opts input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--fg2);margin:-6px 4px 14px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:60;max-width:calc(100% - 32px)}
.empty{text-align:center;color:var(--fg2);padding:22px 16px;font-size:15px}
.skel{height:14px;border-radius:7px;background:var(--fill);margin:10px 0}
/* Motion */
@keyframes slideL{from{opacity:.0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes slideR{from{opacity:.0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.55)}55%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes flash{0%{background:var(--flash)}100%{background:transparent}}
@keyframes shrink{0%{transform:scale(1)}40%{transform:scale(.8)}100%{transform:scale(1)}}
@keyframes ringfill{from{stroke-dashoffset:var(--from)}to{stroke-dashoffset:var(--to)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes burst{0%{transform:rotate(var(--a)) translateY(0) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-78px) scale(.3);opacity:0}}
@keyframes scrimIn{from{background:rgba(0,0,0,0)}}
@keyframes scrimOut{to{background:rgba(0,0,0,0)}}
@keyframes down{to{transform:translateY(60px);opacity:0}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px) scale(.96)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.page.enter-r>*{animation:slideL .34s cubic-bezier(.2,.8,.2,1) both}
.page.enter-l>*{animation:slideR .34s cubic-bezier(.2,.8,.2,1) both}
.page.enter-u>*{animation:fadeUp .3s cubic-bezier(.2,.8,.2,1) both}
.page.enter-r>*:nth-child(2),.page.enter-l>*:nth-child(2),.page.enter-u>*:nth-child(2){animation-delay:.03s}
.page.enter-r>*:nth-child(3),.page.enter-l>*:nth-child(3),.page.enter-u>*:nth-child(3){animation-delay:.06s}
.page.enter-r>*:nth-child(4),.page.enter-l>*:nth-child(4),.page.enter-u>*:nth-child(4){animation-delay:.09s}
.page.enter-r>*:nth-child(5),.page.enter-l>*:nth-child(5),.page.enter-u>*:nth-child(5){animation-delay:.12s}
.page.enter-r>*:nth-child(n+6),.page.enter-l>*:nth-child(n+6),.page.enter-u>*:nth-child(n+6){animation-delay:.15s}
:root{--flash:rgba(52,199,89,.16)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--flash:rgba(48,209,88,.22)}}
:root[data-theme="dark"]{--flash:rgba(48,209,88,.22)}
.check.pop span{animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
.check.pop path{stroke-dasharray:24;animation:draw .32s .12s ease-out both}
.check.unpop span{animation:shrink .3s ease-out}
.task.flash{animation:flash .9s ease-out}
.task .t{transition:color .25s}
.ringanim{animation:ringfill .8s cubic-bezier(.3,.9,.3,1) both}
.bump{display:inline-block;animation:bump .4s ease-out}
.burst{position:absolute;left:48px;top:48px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;animation:burst .95s cubic-bezier(.2,.7,.3,1) both}
.burst i:nth-child(3n){width:6px;height:10px;border-radius:2px}
.tab.bounce svg{animation:pop .42s cubic-bezier(.3,1.5,.5,1)}
.tab svg{transition:transform .2s}
.dayb.sel .n{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
.btn,.row,.tab,.check,.dayb,.seg button,.copy,.link{transition:transform .12s ease,background-color .2s,color .2s,opacity .2s}
.btn:active,.dayb:active,.copy:active{transform:scale(.96)}
.tab:active svg{transform:scale(.85)}
.seg button.on{animation:pop .28s ease-out}
.opts span{transition:background-color .18s,color .18s,transform .12s}
.opts span:active{transform:scale(.95)}
.scrim{animation:scrimIn .25s ease-out}
.scrim.closing{animation:scrimOut .22s ease-in forwards}
.scrim.closing .sheet{animation:down .22s ease-in forwards}
.toast{animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:8px}
.thinking{background-image:linear-gradient(90deg,transparent 0,var(--accent-soft) 50%,transparent 100%);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.ai-btn:disabled{opacity:.8}

/* Buddy */
.buddy-card{overflow:visible}
.buddy-stage{position:relative;display:flex;flex-direction:column;align-items:center;padding:18px 16px 4px;background:radial-gradient(120% 80% at 50% 100%,var(--accent-soft),transparent 70%)}
.bubble{position:relative;background:var(--bg);border-radius:16px;padding:10px 14px;font-size:15px;font-weight:500;max-width:300px;text-align:center;animation:fadeUp .4s ease-out both}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;width:14px;height:14px;background:var(--bg);transform:translateX(-50%) rotate(45deg);border-radius:2px}
.buddy-btn{position:relative;margin-top:6px;border-radius:24px;-webkit-tap-highlight-color:transparent}
.buddy{width:220px;max-width:70vw;height:auto;display:block;overflow:visible}
.buddy .tail{animation:wag .5s ease-in-out infinite alternate}
.buddy.mood-ravi .tail{animation-duration:.18s}
.buddy.mood-triste .tail,.buddy.mood-malade .tail{animation-duration:1.6s}
.buddy.mood-dort .tail{animation:none}
.buddy .bd-body{animation:breathe 3s ease-in-out infinite;transform-origin:100px 205px}
.buddy.mood-dort .bd-body{animation-duration:4.5s}
.buddy.mood-ravi .bd-all{animation:hop 1.1s ease-in-out infinite}
.buddy .bd-head{transform-origin:100px 120px;animation:tilt 5s ease-in-out infinite}
.buddy.mood-triste .bd-head,.buddy.mood-malade .bd-head{transform:translateY(6px) rotate(-4deg);animation:none}
.buddy .blink{transform-origin:100px 82px;animation:blink 4.2s infinite}
.buddy .zzz text{animation:zfloat 2.4s ease-in-out infinite}
.buddy .zzz text:nth-child(2){animation-delay:.4s}.buddy .zzz text:nth-child(3){animation-delay:.8s}
.buddy .hearts path{animation:hfloat 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.buddy .hearts path:nth-child(2){animation-delay:.6s}
.buddy-btn.jump .buddy{animation:jump .7s cubic-bezier(.3,1.4,.5,1)}
.pets{position:absolute;inset:0;pointer-events:none}
.pets i{position:absolute;left:50%;top:35%;width:14px;height:14px;background:var(--pink);clip-path:path("M7 13 L1 7 A3.2 3.2 0 0 1 7 2.6 A3.2 3.2 0 0 1 13 7 Z");animation:petup .9s ease-out both}
.pets i:nth-child(1){--x:-60px}.pets i:nth-child(2){--x:-25px;animation-delay:.05s}.pets i:nth-child(3){--x:5px;animation-delay:.1s}.pets i:nth-child(4){--x:35px;animation-delay:.03s}.pets i:nth-child(5){--x:65px;animation-delay:.08s}
@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(16deg)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,.985)}}
@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-10px)}}
@keyframes tilt{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-6deg)}90%{transform:rotate(4deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes zfloat{0%{opacity:0;transform:translateY(6px)}40%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes hfloat{0%{opacity:0;transform:translateY(8px) scale(.6)}40%{opacity:1}100%{opacity:0;transform:translateY(-16px) scale(1)}}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-36px) rotate(-4deg)}70%{transform:translateY(0) scale(1.04,.94)}100%{transform:none}}
@keyframes petup{0%{opacity:0;transform:translate(-50%,0) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),-90px) scale(1.2)}}
.stats{display:grid;gap:12px;margin-top:16px}
.stat-h{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.stat .bar{height:8px;border-radius:4px;margin-top:6px}
.stat .bar i,.lvl .bar i{transition:width .6s cubic-bezier(.3,.9,.3,1)}
.lvl{margin-top:16px}.lvl .bar{margin-top:6px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--card);border-radius:14px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:var(--shadow)}
.badge span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--fg3);font-weight:700}
.badge.ok span{background:var(--accent);color:#fff;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
.badge small{font-size:12px;color:var(--fg2);line-height:1.25}
.badge.ok small{color:var(--fg)}

/* Buddy studio */
:root{--studio-a:#F7F1EA;--studio-b:#EADFD2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--studio-a:#2A2522;--studio-b:#1C1A19}}
:root[data-theme="dark"]{--studio-a:#2A2522;--studio-b:#1C1A19}
.buddy-card .buddy-stage{position:relative;display:block;padding:14px 0 6px;background:radial-gradient(120% 75% at 50% 82%,var(--studio-a) 0%,var(--studio-b) 70%,var(--card) 100%)}
.buddy-card .bubble{margin:0 auto;width:max-content;max-width:calc(100% - 32px);background:var(--card);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.buddy-card .bubble::after{background:var(--card)}
.buddy3d{position:relative;width:100%;height:300px;display:flex;align-items:center;justify-content:center}
.buddy3d canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:pan-y;cursor:grab;outline:none;animation:fadeUp .5s ease-out both}
.buddy3d canvas:active{cursor:grabbing}
.buddy3d.has3d .buddy-btn{display:none}
.b3-load{display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--fg2);font-size:14px}
.buddy3d.has3d .b3-load{display:none}
.b3-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--fill2);border-top-color:var(--accent);animation:spin .8s linear infinite}
.b3-err{display:none;max-width:24ch;text-align:center}
.buddy3d.b3-fail .b3-spin,.buddy3d.b3-fail .b3-load>small:first-of-type{display:none}
.buddy3d.b3-fail .b3-err{display:block}
.buddy3d .pets{z-index:2}
.pets i:nth-child(6){--x:-5px;animation-delay:.12s}
.zz{position:absolute;right:22%;top:12%;pointer-events:none;font-family:var(--font-r);font-weight:800;color:var(--purple);z-index:2}
.zz span{position:absolute;opacity:0;animation:zfloat 2.6s ease-in-out infinite}
.zz span:nth-child(1){font-size:16px;left:0;top:30px}.zz span:nth-child(2){font-size:21px;left:14px;top:12px;animation-delay:.5s}.zz span:nth-child(3){font-size:27px;left:30px;top:-8px;animation-delay:1s}
.b3-hint{text-align:center;font-size:12px;color:var(--fg2);padding:0 16px 4px}
.buddy3d:not(.has3d)+.b3-hint{visibility:hidden}
.plate{padding:16px}
.plate-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.plate-name{font-family:var(--font-d);font-size:26px;font-weight:700;letter-spacing:-.02em}
.plate-sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip-s{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--fill);color:var(--fg)}
.chip-s i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.vitals{display:flex;align-items:center;gap:18px;margin-top:16px;padding:14px;border-radius:14px;background:var(--fill)}
.rings{flex:none}
.ring-arc{animation:ringdraw 1s cubic-bezier(.3,.9,.3,1) both}
@keyframes ringdraw{from{stroke-dashoffset:var(--c)}}
.legend{display:grid;gap:10px;flex:1;min-width:0}
.leg{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:8px;font-size:14px}
.leg i{width:10px;height:10px;border-radius:50%}
.leg b{font-weight:700}
.bar.xp{height:8px;border-radius:4px;margin-top:6px}
.bar.xp i{background:linear-gradient(90deg,var(--accent),var(--pink));transition:width .6s}
@media (max-width:420px){.buddy3d{height:260px}.vitals{gap:12px}}

/* Family, notifications, summary */
.mav{display:inline-grid;place-items:center;border-radius:50%;background:var(--c);color:#fff;font-weight:700;flex:none;line-height:1;box-shadow:0 0 0 2px var(--card)}
.opts .mav{box-shadow:none;margin-right:2px}
button.alert{width:100%;text-align:left}
button.alert:active{transform:scale(.98)}
.alert .chev{color:var(--fg3)}
button.pill{border:0;cursor:pointer;color:var(--fg)}
.pill.pill-on{background:var(--fg);color:var(--bg)}
.filters{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.task.hl{animation:flash 1.4s ease-out;--flash:rgba(255,59,48,.18)}
.share{display:grid;gap:14px}
.share-row{display:flex;gap:12px;align-items:center}
.share-row .main{flex:1;min-width:0}
.share-h{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}
.share-h span{color:var(--fg2)}
.share .bar{margin-top:6px}
.vet-cta{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;margin-top:8px}
.vet-cta .main{flex:1;min-width:0}.vet-cta .t{font-weight:600}.vet-cta .s{font-size:13px;color:var(--fg2)}
.vet-prev{background:var(--card);border-radius:14px;padding:14px 16px;font-size:14px;line-height:1.45;overflow-x:auto}
.vet-prev h1{font-size:22px;margin:0}.vet-prev h2{font-size:15px;margin:16px 0 6px;padding-top:10px;border-top:.5px solid var(--sep)}
.vet-prev table{border-collapse:collapse;width:100%}.vet-prev th,.vet-prev td{text-align:left;padding:5px 6px;vertical-align:top;border-bottom:.5px solid var(--sep);font-size:13px}
.vet-prev th{color:var(--fg2);font-weight:600}.vet-prev .muted{color:var(--fg2)}.vet-prev ul{margin:4px 0;padding-left:18px}.vet-prev p{margin:4px 0}
.switch{width:51px;height:31px;border-radius:999px;background:var(--fill2);position:relative;flex:none;transition:background-color .2s}
.switch i{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .22s cubic-bezier(.3,1.3,.5,1)}
button.switch{border:0;padding:0;cursor:pointer}
.switch.on{background:var(--green)}.switch.on i{transform:translateX(20px)}
.notif{position:fixed;z-index:70;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));max-width:560px;margin:0 auto;
  display:flex;gap:12px;align-items:center;padding:12px 12px 12px 14px;border-radius:20px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  box-shadow:0 10px 30px rgba(0,0,0,.18);animation:notifIn .45s cubic-bezier(.2,1.2,.4,1)}
.notif .main{flex:1;min-width:0}.notif .t{font-weight:600;font-size:15px}.notif .s{font-size:14px;color:var(--fg2)}
.notif .btn{padding:8px 14px;min-height:36px}.notif .nx{width:32px;height:32px;border-radius:50%;background:var(--fill);font-size:20px;line-height:1;color:var(--fg2)}
@keyframes notifIn{from{transform:translateY(-120%);opacity:0}}
button.leg{width:100%;text-align:left;grid-template-columns:10px 1fr auto 14px;border-radius:8px}
button.leg .chev{color:var(--fg3)}
button.badge{border:0;cursor:pointer;color:var(--fg)}
button.bubble{border:0;cursor:pointer;color:var(--fg);font:inherit;font-size:15px;font-weight:500;display:block}
.ask{padding:14px 16px;margin-top:12px;animation:fadeUp .35s ease-out both}
.ask-h{display:flex;gap:12px;align-items:flex-start}.ask-h .main{flex:1;min-width:0}.ask-h .t{font-weight:600}.ask-h .s{font-size:14px;color:var(--fg2);margin-top:2px}
.ask-b{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

/* Organisation: dashboard tiles, sub-tabs, end of day, settings, food */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:8px;align-items:center;text-align:left;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);min-width:0}
.tile .ico{grid-row:1;width:26px;height:26px;border-radius:8px}.tile .ico svg{width:15px;height:15px}
.tile-l{font-size:13px;font-weight:600;color:var(--fg2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile b{grid-column:1/-1;font-family:var(--font-r);font-size:22px;font-weight:700;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{grid-column:1/-1;font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile:active{transform:scale(.97)}
.subtabs{margin:4px 0 6px}
.subpage>.sec:first-child{margin-top:12px}
.eod{background:var(--card);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.eod-h{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px}
.eod-h .main{flex:1;min-width:0}.eod-h .t{font-weight:600}.eod-h .s{font-size:13px;color:var(--fg2);overflow-wrap:anywhere}
.eod-h .chev{transition:transform .25s}.eod.open .eod-h .chev{transform:rotate(90deg)}
.eod-b{padding:0 12px 14px;background:var(--bg);border-top:.5px solid var(--sep);animation:fadeUp .3s ease-out both}
.eod-b>.sec:first-child{margin-top:14px}
.topbar{padding-top:14px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;min-height:36px;margin-left:-6px}
.food-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.food .s{font-size:14px;color:var(--fg2);margin-top:4px}.food-kg{font-size:15px;color:var(--fg2)}.food-kg b{color:var(--fg);font-size:19px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* setup wizard */
body.wiz-open{overflow:hidden}
.wiz{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;animation:wzIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes wzIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.wz-top{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 6px;max-width:640px;width:100%;margin:0 auto}
.wz-top .back{justify-self:start}
.wz-prog{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.wz-prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.wz-skip{justify-self:end;background:none;border:0;color:var(--accent);font:inherit;font-size:16px;padding:8px 4px;cursor:pointer}
.wz-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 20px 24px;max-width:640px;width:100%;margin:0 auto}
.wz-body.in-r{animation:wzR .38s cubic-bezier(.2,.8,.2,1)}.wz-body.in-l{animation:wzL .38s cubic-bezier(.2,.8,.2,1)}
@keyframes wzR{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes wzL{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
.wz-t{font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-.02em;margin:6px 0 10px}
.wz-s{color:var(--fg2);font-size:17px;line-height:1.4;margin:0 0 18px}
.wz-hero{display:flex;justify-content:center;margin:14px 0 14px}.wz-hero .buddy{width:190px;height:auto}
.wz-field{margin:16px 0}
.wz-lab{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);margin:0 0 8px 4px}
.wz-hint{font-size:14px;color:var(--fg2);margin:6px 0 0 4px}
.wz-big{font-size:26px!important;font-weight:700;text-align:center;padding:16px!important}
.wz-photo{display:flex;flex-direction:column;align-items:center;gap:8px;margin:18px auto 22px;cursor:pointer;color:var(--accent);font-size:15px}
.wz-photo span,.wz-photo img{width:120px;height:120px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;color:var(--fg3);object-fit:cover;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.wz-list{overflow:hidden}
.wz-list .row .wz-tick{color:var(--accent);opacity:0;transform:scale(.5);transition:opacity .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}.wz-list .row.sel .wz-tick{opacity:1;transform:none}.wz-list .row.sel .t{color:var(--accent);font-weight:600}
.wz-in{max-width:560px;margin:0 auto}
.wz-seg button{transition:background-color .2s,color .2s,box-shadow .2s}
.wz-chips{display:flex;flex-wrap:wrap;gap:8px}
.wz-chip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 16px;font:inherit;font-size:16px;background:var(--card);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--sep);cursor:pointer;transition:background-color .2s,color .2s,box-shadow .2s,transform .25s cubic-bezier(.34,1.56,.64,1);-webkit-tap-highlight-color:transparent}
.wz-chip i{display:none;width:16px;height:16px}.wz-chip i svg{width:16px;height:16px}
.wz-chip.on{background:var(--accent);color:#fff;box-shadow:none}.wz-chip.on i{display:inline-grid}
.wz-chip:active{transform:scale(.95)}
.wz-lab-s{text-transform:none;letter-spacing:0;font-weight:500;color:var(--fg3);margin-left:4px}
.wz-radio{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px var(--fg3);transition:box-shadow .2s}
.wz-choice .card{flex-direction:row!important;align-items:center;gap:14px!important}.wz-choice .card>div{display:flex;flex-direction:column;gap:2px}
.wz-choice .card.on .wz-radio{box-shadow:inset 0 0 0 7px var(--accent)}
.wz-dog{width:128px;height:128px;filter:drop-shadow(0 14px 26px rgba(217,120,58,.35));animation:wzFloat 4s ease-in-out infinite}
.wz-dog .wz-eyes{animation:wzBlink 4.5s infinite;transform-origin:80px 80px}
.wz-dog .wz-ears{animation:wzEars 3.2s ease-in-out infinite;transform-origin:80px 50px}
@keyframes wzFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes wzBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wzEars{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}
.wz-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0 4px}
.wz-steps div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--fg2);text-align:center}
.wz-steps span{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff}.wz-steps span svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){.wz-dog,.wz-dog .wz-eyes,.wz-dog .wz-ears{animation:none}}
.wz-list .row{width:100%}.wz-list [hidden]{display:none!important}
.wz-r.off{opacity:.45}.wz-r .wz-time{width:116px;flex:none;padding:8px 10px!important;font-size:16px}
.wz-r .switch{flex:none;margin-left:8px}
.wz-note{background:var(--fill);border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.4;color:var(--fg2)}
.wz-choice{display:grid;gap:12px}
.wz-choice .card{display:flex;flex-direction:column;gap:4px;text-align:left;padding:18px;border:2px solid transparent;cursor:pointer;font:inherit;color:inherit;transition:border-color .2s,transform .15s}
.wz-choice .card b{font-size:18px}.wz-choice .card span{color:var(--fg2);font-size:15px}
.wz-choice .card.on{border-color:var(--accent)}.wz-choice .card:active{transform:scale(.98)}
.wz-foot{padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;width:100%;margin:0 auto}
.wz-next{width:100%;font-size:18px;padding:16px;border-radius:16px}
.wz-next:disabled{opacity:.4}
.wz-later{background:none;border:0;color:var(--accent);font:inherit;font-size:16px;padding:10px;cursor:pointer}
.chip-x{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--fill2);color:var(--fg);border-radius:999px;padding:6px 12px 6px 6px;font:inherit;font-size:15px;cursor:pointer}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:8px;vertical-align:-3px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* invite */

.wx-c{font-size:15px;font-weight:600;margin-top:4px}
.wx-hl{font-size:13px;color:var(--fg2);margin-top:2px}
.wx .wx-big{font-size:56px;line-height:1;margin-top:6px}
.wx-win{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;font-weight:600;color:var(--green)}
.wx-win i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.wx .wx-strip{display:flex;gap:0;overflow-x:auto;margin:10px -16px 0;padding:10px 10px 8px;border-top:.5px solid var(--sep);border-bottom:.5px solid var(--sep);scrollbar-width:none}
.wx .wx-hr{flex:none;width:52px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0 6px;border-radius:0;background:none!important;position:relative}
.wx .wx-hr small{font-size:12px;font-weight:600;color:var(--fg2)}
.wx .wx-hr span{font-size:20px;line-height:1.15}
.wx .wx-hr i{font-style:normal;font-size:11px;font-weight:700;color:var(--blue);min-height:13px;line-height:13px}
.wx .wx-hr b{font-size:16px;font-weight:600}
.wx .wx-hr u{display:grid;place-items:center;height:12px;color:var(--accent)}.wx .wx-hr u svg{width:11px;height:11px}
.wx .wx-hr::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:2px;background:transparent}
.wx .wx-hr.best::after{background:var(--green)}.wx .wx-hr.bad::after{background:var(--red);opacity:.7}
.wx .wx-hr em{display:none}
.wx-sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);margin:14px 0 4px}
.wx .wx-walks{display:block;margin:0}
.wx .wx-walk{display:flex;align-items:center;gap:12px;padding:10px 0;border-radius:0;background:none!important}
.wx .wx-walk+.wx-walk{border-top:.5px solid var(--sep)}
.wx-wtime{font-size:15px;font-weight:600;width:46px;flex:none}
.wx .wx-walk .main{flex:1;min-width:0}.wx .wx-walk .t{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx .wx-walk .s{font-size:13px;color:var(--fg2);margin-top:1px}
.wx .wx-alt{font-size:13px;font-weight:600;color:var(--accent);margin-top:3px}
.wx .wx-v{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;flex:none}
.wx-foot{font-size:13px;color:var(--fg2);padding:8px 0 10px}
/* Default pictures: the logo in each person's colour, the dog drawing for the dog */
.mav .mk{display:block;width:76%;height:76%;background:#fff;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.avatar.dflt{background:#FAFAFA}
.swatches{gap:10px 12px}
/* Dogs Life brand */
.brand-logo{display:block;border-radius:23%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 10px 28px rgba(0,0,0,.14);flex:none}
.brand-logo.sm{box-shadow:0 0 0 .5px var(--sep)}
.brand-tag{gap:8px!important}
h1.brand{font-family:var(--font-r);letter-spacing:-.01em}
.brand-tag{display:inline-flex;align-items:center;gap:6px;margin:0 4px 4px;font-family:var(--font-r);font-weight:700;font-size:15px;color:var(--accent)}
/* Messages: the panel grows with the messages, then scrolls */
.msg-list{display:grid;gap:12px;max-height:min(420px,55vh);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;margin:0 -6px;padding:2px 6px;scrollbar-width:thin}
.msg-list.more-below{-webkit-mask-image:linear-gradient(#000 calc(100% - 36px),transparent);mask-image:linear-gradient(#000 calc(100% - 36px),transparent)}
.msg-list.more-above{-webkit-mask-image:linear-gradient(transparent,#000 28px);mask-image:linear-gradient(transparent,#000 28px)}
.msg-list.more-above.more-below{-webkit-mask-image:linear-gradient(transparent,#000 28px,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(transparent,#000 28px,#000 calc(100% - 36px),transparent)}
/* Planning */
.pl-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pl-day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 9px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);transition:transform .15s,background .2s}
.pl-day:active{transform:scale(.94)}
.pl-day .l{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--fg2)}
.pl-day .n{font-family:var(--font-r);font-size:19px;font-weight:700;line-height:1.1}
.pl-day .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:30px;min-height:6px}
.pl-day .dots i{width:5px;height:5px;border-radius:50%}
.pl-day.today{outline:2px solid var(--accent);outline-offset:-2px}.pl-day.today .l{color:var(--accent);font-weight:700}
.pl-day.today.on{outline:none}.pl-day.today.on .l{color:#fff}
.pl-pick{width:100%;flex:1 1 100%}.pl-wkh{display:flex;white-space:nowrap;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 8px;font-size:13px;color:var(--fg2)}.pl-wkh .link{font-size:13px;color:var(--accent);font-weight:600}
.pl-day.on{background:var(--accent);color:#fff}
.pl-day.on .l{color:rgba(255,255,255,.85)}
.pl-day.on .dots i{box-shadow:0 0 0 1px rgba(255,255,255,.9)}
.pl-hero-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pl-title{font-family:var(--font-d);font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.pl-count{text-align:center;flex:none}
.pl-count b{display:block;font-family:var(--font-r);font-size:30px;line-height:1;color:var(--accent)}
.pl-count small{font-size:12px;color:var(--fg2)}
.pl-ribbon{position:relative;height:46px;margin:18px 4px 6px;border-radius:12px;background:var(--fill)}
.pl-night{position:absolute;top:0;bottom:0;background:var(--fill2);border-radius:12px}
.pl-tick{position:absolute;top:0;bottom:0;border-left:1px dashed var(--sep)}
.pl-tick b{position:absolute;top:100%;transform:translateX(-50%);font-size:10px;font-weight:600;color:var(--fg3);margin-top:2px}
.pl-now{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--red);border-radius:1px}
.pl-now::before{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.pl-pin{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;box-shadow:0 0 0 2px var(--card);animation:pop .45s cubic-bezier(.3,1.5,.5,1) both}
.pl-pin svg{width:14px;height:14px}
.pl-pin.past{opacity:.4}
.pl-pin.next{width:32px;height:32px;margin:-16px 0 0 -16px;z-index:1;box-shadow:0 0 0 3px var(--card),0 0 0 6px color-mix(in srgb,var(--c) 35%,transparent)}
.pl-next{display:flex;align-items:center;gap:12px;margin-top:20px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:15px}
.pl-next small{display:block;font-size:13px;color:var(--fg2);margin-top:1px}
.pl-next.done{color:var(--fg2)}
.pl-next.late{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red);font-weight:600;margin-top:10px}
.pl-pulse{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;animation:plPulse 1.8s ease-out infinite}
@keyframes plPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.pl-mom{margin-top:22px}
.pl-mom-h{display:flex;align-items:center;gap:8px;margin:0 4px 8px;font-family:var(--font-d);font-size:20px;font-weight:700}
.pl-mom-h small{font-family:var(--font);font-size:13px;font-weight:600;color:var(--fg2);background:var(--fill);border-radius:999px;padding:1px 8px}
.pl-tl{padding:4px 0}
.pl-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;min-height:62px}
.pl-item:active{background:var(--fill)}
.pl-item+.pl-item::before{content:"";position:absolute;left:79px;top:-12px;height:24px;width:2px;background:var(--sep)}
.pl-time{width:44px;font-weight:600;font-size:15px;flex:none}
.pl-node{width:34px;height:34px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;position:relative;z-index:1}
.pl-node svg{width:18px;height:18px}
.pl-item .main{flex:1;min-width:0}
.pl-item .t{font-weight:600}
.pl-item .s{font-size:13px;color:var(--fg2);margin-top:1px;overflow-wrap:anywhere}
.pl-item.past .t,.pl-item.past .pl-time{color:var(--fg2)}
.pl-item.past .pl-node{opacity:.45}
.pl-item.next{background:color-mix(in srgb,var(--c) 10%,transparent)}
.pl-item.next .pl-node{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.pl-badge{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--c);border-radius:999px;padding:2px 8px;vertical-align:2px;margin-left:4px}
.pl-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:12px;border-radius:14px;border:1.5px dashed var(--fg3);color:var(--accent);font-weight:600}
.pl-add span{font-size:20px;line-height:1}
.pl-empty-i{font-size:40px;margin-bottom:8px}
.pl-week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;height:120px;align-items:end}
.pl-wcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.pl-stack{display:flex;flex-direction:column-reverse;gap:2px;width:100%;max-width:26px;min-height:4px;border-radius:6px;overflow:hidden;transition:height .5s cubic-bezier(.2,.8,.2,1)}
.pl-stack i{flex:1;min-height:3px}
.pl-wcol small{font-size:11px;font-weight:600;color:var(--fg2)}
.pl-wcol.on small{color:var(--accent)}
.ap-hero{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border-left:5px solid var(--c)}
.ap-cd{width:74px;height:74px;border-radius:20px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.ap-cd b{font-family:var(--font-r);font-size:30px;line-height:1}
.ap-cd small{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-top:2px;text-align:center}
.ap-hero .main{flex:1;min-width:0}
.ap-hero .t{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;margin:4px 0 2px}
.ap-hero .t .ico{width:26px;height:26px;border-radius:7px}
.ap-hero .t .ico svg{width:15px;height:15px}
.ap-hero .s{font-size:14px;color:var(--fg2)}
@media (prefers-reduced-motion: reduce){.pl-pin,.pl-pulse{animation:none}}
@media (max-width:380px){.pl-days{gap:4px}.pl-item+.pl-item::before{left:75px}}

.msg-sys{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:var(--fg2)}
.wz-joincard{display:flex!important;flex-direction:row!important;align-items:center;gap:12px;width:100%;text-align:left;border:0;padding:14px;margin-top:18px;font:inherit;color:inherit;cursor:pointer}
.wz-joincard .main{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.wz-joincard span:not(.ico):not(.chev){color:var(--fg2);font-size:14px}

/* invitations */
.role-g{display:grid;gap:10px}
.role-c{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid transparent;background:var(--fill);border-radius:14px;padding:12px 14px;font:inherit;color:var(--fg);cursor:pointer;transition:border-color .2s}
.role-c>div{display:flex;flex-direction:column;gap:2px}.role-c span{font-size:14px;color:var(--fg2)}
.role-c.on{border-color:var(--accent);background:var(--card)}.role-c.on .wz-radio{box-shadow:inset 0 0 0 7px var(--accent)}
.inv-ok{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--green) 12%,var(--card));border-radius:14px;padding:12px 14px}
.inv-ok>svg{width:22px;height:22px;color:var(--green);flex:none}.inv-ok div{display:flex;flex-direction:column}.inv-ok span{font-size:14px;color:var(--fg2)}
.inv-row .main{min-width:0}

/* family code */
.code-in{text-align:center;letter-spacing:.18em;font-weight:700;text-transform:uppercase;font-variant-numeric:tabular-nums}
.code-in.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97);box-shadow:inset 0 0 0 2px var(--red)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}
.code-show{font-weight:700;letter-spacing:.12em;color:var(--accent)}

.code-card{display:flex;flex-direction:column;align-items:center;gap:6px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 14%,var(--card)),var(--card));border-radius:20px;padding:20px 14px;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 30%,transparent)}
.code-card span{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.code-card b{font-size:42px;letter-spacing:.14em;font-weight:800}.code-card small{font-size:13px;color:var(--fg2)}

/* GPS walks */
.walk-live{margin:-4px 0 12px}
.rmap{position:relative;overflow:hidden;border-radius:14px;height:150px;background:var(--fill);isolation:isolate}
.rmap.big{height:240px;margin:2px 0 14px}
.rmap-t img{position:absolute;width:256px;height:256px;max-width:none;user-select:none;-webkit-user-drag:none}
.rmap-s{position:absolute;inset:0;pointer-events:none}
.rt-halo{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.rt-line{fill:none;stroke:var(--green);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.rt-a{fill:#fff;stroke:var(--green);stroke-width:3}
.rt-b{fill:var(--green);stroke:#fff;stroke-width:3}
.rt-me{fill:#0A84FF;stroke:#fff;stroke-width:3}
.rt-pulse{fill:#0A84FF;opacity:.25;transform-box:fill-box;transform-origin:center;animation:rtp 1.8s ease-out infinite}
@keyframes rtp{0%{transform:scale(.6);opacity:.35}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.rt-pulse{animation:none}}
.rmap-c{position:absolute;right:6px;bottom:4px;font-size:9.5px;color:#555;background:rgba(255,255,255,.7);padding:1px 5px;border-radius:5px}
.wv-when{font-size:14px;color:var(--fg2);margin:0 2px 10px}
.wv-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wv-s{background:var(--fill);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px}
.wv-s b{font-size:20px;font-weight:600;letter-spacing:-.01em}.wv-s span{font-size:12px;color:var(--fg2)}
.wv-tags{display:flex;gap:8px;margin-top:10px}.wv-tags span{display:inline-flex;align-items:center;gap:6px;background:var(--fill);border-radius:999px;padding:5px 11px;font-size:13px}
.wv-tags svg{width:14px;height:14px}
.wv-week{margin-top:12px;font-size:14px;color:var(--fg2);text-align:center}
.ql-walk .gps{color:var(--fg2)}

/* weather, folded */
.wx-mini{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;margin-top:12px;border:0;font:inherit;color:inherit;cursor:pointer}
.wx-mini .wx-mi{font-size:28px;line-height:1;width:34px;text-align:center}
.wx-mini .main{flex:1;min-width:0}.wx-mini .t{font-size:16px}.wx-mini .t b{font-weight:600}
.wx-mini .s{font-size:14px;color:var(--green);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx-mini.meh .s{color:var(--orange)}.wx-mini.bad .s{color:var(--red)}
.wx-mini.meh{box-shadow:inset 3px 0 0 var(--orange)}.wx-mini.bad{box-shadow:inset 3px 0 0 var(--red)}
.wx-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.wx-dn,.wx-less span{color:var(--fg3);display:inline-flex}.wx-dn svg{transform:rotate(90deg);width:16px;height:16px}
.wx-less{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;margin-top:8px;padding:8px;border:0;background:none;color:var(--fg2);font:inherit;font-size:14px;cursor:pointer}
.wx-less span svg{transform:rotate(-90deg);width:14px;height:14px}

.pl-day .c{display:block;font-size:10.5px;font-weight:500;color:var(--fg2);margin-top:1px;white-space:nowrap}.pl-day.on .c{color:inherit;opacity:.85}

.gate{position:fixed;inset:0;z-index:9000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));overflow:auto}
.gate-in{max-width:380px;width:100%;text-align:center}
.gate-bell{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.gate h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
.gate p{color:var(--fg2);font-size:16px;line-height:1.45;margin:0 0 18px}
.gate .gate-small{font-size:13px;margin:12px 0 0}
.gate-btn{width:100%;padding:15px;font-size:17px;border-radius:14px}
.gate-steps{text-align:left;margin:0 0 20px;padding:0;list-style:none;counter-reset:g;background:var(--card);border-radius:16px;box-shadow:var(--shadow)}
.gate-steps li{counter-increment:g;display:flex;align-items:center;gap:12px;padding:13px 14px;font-size:15px;border-top:.5px solid var(--sep)}
.gate-steps li:first-child{border-top:0}
.gate-steps li::before{content:counter(g);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.gate-ic{margin-left:auto;color:var(--accent);font-size:18px}
body.gate-open{overflow:hidden}

/* notification centre */
.top-r{display:flex;align-items:center;gap:10px}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);color:var(--fg);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.bell:active{transform:scale(.93)}
.bell-n{position:absolute;top:-3px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)}
.bell-n[hidden]{display:none}
.n-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 10px;min-height:22px}
.n-live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg2)}
.n-live i{width:8px;height:8px;border-radius:50%;background:var(--gray)}
.n-live.on i{background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.n-head .link{font-size:14px;color:var(--accent);font-weight:600;background:none;border:0;padding:0}
.n-list{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;max-height:58vh;overflow-y:auto}
.n-it{display:flex;align-items:stretch;border-top:.5px solid var(--sep)}
.n-it:first-child{border-top:0}
.n-main{flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:12px 6px 12px 14px;background:none;border:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.n-ic{flex:none;width:34px;height:34px;border-radius:10px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px}
.n-main .main{flex:1;min-width:0}.n-main .t{font-size:15px;font-weight:500}.n-main .s{font-size:14px;color:var(--fg2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.n-time{font-size:12px;color:var(--fg3);margin-top:3px}
.n-it.unread .t{font-weight:700}.n-it.unread{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.n-dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px}
.n-x{flex:none;width:40px;border:0;background:none;color:var(--fg3);font-size:20px;cursor:pointer}
.n-empty{padding:34px 16px;text-align:center;color:var(--fg2);font-size:15px;line-height:1.8}

/* facts */
.facts{padding:4px 0}

.fact:first-child{border-top:0}

.fact-l{margin:0;padding-left:18px}.fact-l li{margin:1px 0}
.card > .facts + .list{border-top:.5px solid var(--sep)}
.fact-msgs{margin-top:6px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.35}.fact-msgs span{color:var(--fg3);font-size:12.5px;white-space:nowrap}.fact-msgs .link{align-self:flex-start;color:var(--accent);font-weight:600;background:none;border:0;padding:0;font-size:14px}
.rp{padding:4px 16px 8px}.rp-s{padding:12px 0;border-bottom:.5px solid var(--sep)}.rp-s:last-child{border-bottom:0}.rp-s h3{margin:0 0 6px;font-size:15px;font-weight:700;display:flex;gap:8px;align-items:center}.rp-s h3 .num{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--fill,rgba(120,120,128,.14));font-size:12px;color:var(--fg2)}.rp p{margin:4px 0;font-size:14.5px;line-height:1.45;color:var(--fg2)}.rp-none{color:var(--fg3)!important;font-style:italic}.rp-l{margin:4px 0;padding-left:0;list-style:none;font-size:14.5px;line-height:1.45;color:var(--fg2)}.rp-l li{padding:3px 0}.rp-l li b.num{display:inline-block;min-width:44px;color:var(--fg)}.rp-att li b,.rp-l li>b:not(.num){color:var(--fg)}.rp-sub{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--fg3);text-transform:uppercase;letter-spacing:.03em}.rp-ok{color:var(--green);font-weight:600}.rp-no{color:var(--red,#e5484d);font-weight:600}.rp-miss{color:var(--orange);font-weight:600}.rp-soon{color:var(--fg3);font-weight:600}.rp-q{margin:8px 0 2px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.4;padding-left:10px;border-left:3px solid var(--sep)}.rp-q span{display:block;color:var(--fg3);font-size:12.5px}.rp-tag{font-size:11px;padding:1px 7px;border-radius:9px;background:var(--fill,rgba(120,120,128,.14));color:var(--fg2);font-weight:500}.rp-word{font-size:15px!important;color:var(--fg)!important}
.xtra{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:1px 7px;border-radius:9px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);vertical-align:2px;margin-left:4px}.xtra-add{width:100%;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px}.xtra-add svg{width:18px;height:18px}
.medinfo{margin-top:6px;font-size:13px;line-height:1.35;color:var(--fg2);background:color-mix(in srgb,var(--pink) 10%,transparent);border-radius:10px;padding:7px 10px}.medinfo b{color:var(--fg)}.medinfo.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}.medinfo.danger b{color:var(--red)}

.sh-hero{display:flex;gap:12px;align-items:center;padding:14px;margin:2px 0 16px;border-radius:16px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 22%,var(--card)),var(--card));border:.5px solid color-mix(in srgb,var(--c) 30%,transparent)}
.sh-hero-i{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 40%,transparent);transition:background .2s}
.sh-hero-i svg{width:24px;height:24px}
.sh-hero-t{font-size:17px;font-weight:700;font-family:var(--font-d)}.sh-hero-s{font-size:13px;color:var(--fg2);margin-top:2px;line-height:1.3}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tg{position:relative;cursor:pointer}.tg input{position:absolute;opacity:0;pointer-events:none}
.tg-i{display:grid;place-items:center;width:40px;height:40px;margin:10px auto 6px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c);transition:transform .15s,background .15s,color .15s}
.tg-i svg{width:22px;height:22px}
.tg-l{display:block;text-align:center;font-size:12.5px;font-weight:600;color:var(--fg2);padding:0 4px 10px;line-height:1.2}
.tg::before{content:"";position:absolute;inset:0;border-radius:14px;background:var(--card);border:1.5px solid transparent;z-index:-1;transition:border-color .15s,box-shadow .15s}
.tg{isolation:isolate}
.tg:has(input:checked)::before{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.tg input:checked~.tg-i{background:var(--c);color:#fff;transform:scale(1.06)}.tg input:checked~.tg-l{color:var(--fg)}
.tg input:focus-visible~.tg-i{outline:2px solid var(--c);outline-offset:2px}
input.f.big{font-size:18px;font-weight:600;min-height:50px;border-radius:14px;background:var(--card);padding:12px 14px}
.when{display:grid;grid-template-columns:1fr auto 1fr;background:var(--card);border-radius:14px;overflow:hidden}
.when-f{display:grid;gap:2px;padding:10px 12px;min-width:0;cursor:pointer}
.when-k{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fg3)}.when-k svg{width:13px;height:13px}
.when input{width:100%;min-width:0;border:0;background:none;font:inherit;font-size:17px;font-weight:600;color:var(--fg);padding:0;-webkit-appearance:none;appearance:none;text-align:left;min-height:26px}
.when input::-webkit-date-and-time-value{text-align:left}
.when-sep{width:.5px;background:var(--sep);margin:10px 0}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:2px;padding:2px}.quick::-webkit-scrollbar{display:none}
.qk{flex:none;padding:7px 12px;border-radius:999px;background:var(--fill);font-size:13.5px;font-weight:600;color:var(--fg2)}.qk.on{background:var(--accent-soft);color:var(--accent)}
.segs{display:flex;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.segs label{flex:1;position:relative}.segs input{position:absolute;opacity:0;pointer-events:none}
.segs span{display:block;text-align:center;padding:8px 2px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--fg2);cursor:pointer;transition:background .15s}
.segs input:checked+span{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tgl-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer}
.tgl-row b{display:block;font-size:16px;font-weight:600}.tgl-row small{display:block;font-size:12.5px;color:var(--fg2);margin-top:2px}
.tgl{flex:none;-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;cursor:pointer;transition:background .2s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.3,.7,.4,1)}
.tgl:checked{background:var(--green)}.tgl:checked::after{transform:translateX(20px)}.tgl:disabled{opacity:.4}

.hx{padding:16px;margin-top:12px}
.hx .sum{grid-template-columns:auto 1fr;gap:16px}
.hx-pct{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700;font-family:var(--font-r)}
.hx .catstats{margin-top:14px}
.hx-next{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 10px 10px 12px;border-radius:14px;background:color-mix(in srgb,var(--c,var(--accent)) 12%,var(--fill))}
.hx-next .main{flex:1;min-width:0}
.hx-ni{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--c,var(--accent));color:#fff}.hx-ni svg{width:20px;height:20px}
.hx-nk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:500;color:var(--fg2)}
.hx-nt{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hx-tick{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--c,var(--accent));color:var(--c,var(--accent));display:grid;place-items:center;background:var(--card)}.hx-tick svg{width:18px;height:18px;opacity:.35}.hx-tick:active{transform:scale(.92)}
.hx-next.done{background:color-mix(in srgb,var(--green) 12%,var(--fill))}
.hx-h{margin-top:24px;align-items:center}
.hx-count{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--red);color:#fff;font-size:13px;font-weight:700;display:inline-grid;place-items:center;margin-right:auto;margin-left:8px}
.hx-add{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:15px;font-weight:600}.hx-add svg{width:15px;height:15px}
#prog-h+.filters{margin-top:4px}
.lw{margin-top:12px;padding:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--green) 22%,var(--card)),var(--card));border:.5px solid color-mix(in srgb,var(--green) 35%,transparent)}
.lw-top{display:flex;align-items:center;gap:12px}.lw-top .main{flex:1;min-width:0}
.lw-k{font-size:13px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.03em}
.lw-t{font-size:15px;color:var(--fg2);margin-top:2px}.lw-t b{font-size:28px;color:var(--fg);font-family:var(--font-r)}
.lw .rmap{margin-top:12px}
.lw-btns{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:12px}
.task .time.at{color:var(--green)}
.tt-edit{background:none;border:0;padding:0;text-align:left;font:inherit;font-weight:600;font-size:15px;color:var(--green);text-decoration:underline dotted color-mix(in srgb,var(--green) 55%,transparent);text-underline-offset:4px;cursor:pointer}

/* ================= AURORA — Apple × HMI (yellow → green glow). The classic look stays under data-skin="classic". ================= */
@font-face{font-family:"Figtree";src:url("fonts/figtree.woff2") format("woff2");font-weight:300 900;font-style:normal;font-display:swap}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes dl-ring{to{--a:360deg}}
@keyframes dl-drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12%,-8%) scale(1.15)}100%{transform:translate(-10%,6%) scale(.9)}}
@keyframes dl-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.aurora{display:none}
:root[data-skin="aurora"]{
  --g1:#fde047;--g2:#bef264;--g3:#4ade80;--g4:#10b981;--on-grad:#0b1a0f;
  --grad:linear-gradient(120deg,var(--g1),var(--g2) 40%,var(--g3) 75%,var(--g4));
  --ring:conic-gradient(from var(--a),var(--g1),var(--g2),var(--g3),var(--g4),var(--g3),var(--g2),var(--g1));
  --bg:#F3F5F0;--solid:#FFFFFF;--card:rgba(255,255,255,.86);--fg:#101410;--fg2:#5B635E;--fg3:#A2A9A4;
  --sep:rgba(16,40,20,.09);--fill:rgba(24,60,30,.065);--fill2:rgba(24,60,30,.12);--edge:rgba(255,255,255,.9);
  --accent:#15803D;--accent-soft:rgba(34,197,94,.13);--green:#16A34A;
  --bar:rgba(255,255,255,.72);--sheet:#F6F8F3;--seg-on:#FFFFFF;--eyebrow:linear-gradient(90deg,#65A30D,#059669);--shadow:0 1px 2px rgba(16,40,20,.04),0 8px 24px rgba(16,40,20,.06);
  --font:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--font-d:var(--font);--font-r:var(--font);
}
@media (prefers-color-scheme: dark){:root[data-skin="aurora"]:not([data-theme="light"]){
  --bg:#0B0C10;--solid:#16181E;--card:rgba(25,27,33,.86);--fg:#EEF1EC;--fg2:#9AA29D;--fg3:#5B625E;
  --sep:rgba(255,255,255,.075);--fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.07);
  --accent:#A3E635;--accent-soft:rgba(163,230,53,.14);--green:#4ADE80;
  --bar:rgba(18,20,25,.66);--sheet:#121318;--seg-on:rgba(255,255,255,.13);--eyebrow:var(--grad);--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.35);
}}
:root[data-skin="aurora"][data-theme="dark"]{
  --bg:#0B0C10;--solid:#16181E;--card:rgba(25,27,33,.86);--fg:#EEF1EC;--fg2:#9AA29D;--fg3:#5B625E;
  --sep:rgba(255,255,255,.075);--fill:rgba(255,255,255,.07);--fill2:rgba(255,255,255,.12);--edge:rgba(255,255,255,.07);
  --accent:#A3E635;--accent-soft:rgba(163,230,53,.14);--green:#4ADE80;
  --bar:rgba(18,20,25,.66);--sheet:#121318;--seg-on:rgba(255,255,255,.13);--eyebrow:var(--grad);--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px rgba(0,0,0,.35);
}
:root[data-skin="aurora"] body{background:transparent;letter-spacing:-.005em}
:root[data-skin="aurora"] .aurora{display:block;position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;opacity:.5}
:root[data-skin="aurora"] .aurora i{position:absolute;width:62%;height:48%;border-radius:50%;filter:blur(80px);opacity:.32;animation:dl-drift 24s ease-in-out infinite alternate}
:root[data-skin="aurora"] .aurora i:nth-child(1){background:var(--g1);left:-12%;top:-14%}
:root[data-skin="aurora"] .aurora i:nth-child(2){background:var(--g3);right:-18%;top:12%;animation-duration:30s;animation-delay:-8s}
:root[data-skin="aurora"] .aurora i:nth-child(3){background:var(--g2);left:10%;bottom:-18%;animation-duration:27s;animation-delay:-14s}
:root[data-skin="aurora"] .aurora i:nth-child(4){background:var(--g4);right:-10%;bottom:10%;width:40%;height:34%;opacity:.22;animation-duration:33s}
@media (prefers-color-scheme: light){:root[data-skin="aurora"]:not([data-theme="dark"]) .aurora{opacity:.55}:root[data-skin="aurora"]:not([data-theme="dark"]) .aurora i{opacity:.28}}
/* type */
:root[data-skin="aurora"] h1{font-weight:800;letter-spacing:-.035em;font-size:36px}
:root[data-skin="aurora"] .eyebrow{background:var(--eyebrow);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;letter-spacing:.06em}
:root[data-skin="aurora"] .sec-h h2{font-weight:800;letter-spacing:-.025em}
:root[data-skin="aurora"] .period{font-weight:700;letter-spacing:.08em;font-size:12px}
/* glass surfaces */
:root[data-skin="aurora"] .card,:root[data-skin="aurora"] .alert{background:var(--card);border-radius:22px;border:.5px solid var(--edge);box-shadow:var(--shadow)}
:root[data-skin="aurora"] .alert{padding:13px 14px}
:root[data-skin="aurora"] .alert .ic,:root[data-skin="aurora"] .ico{border-radius:11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}

/* hero + live walk: the HMI glowing ring */
:root[data-skin="aurora"] .hx,:root[data-skin="aurora"] .lw{position:relative;border:1.5px solid transparent;background:linear-gradient(var(--solid),var(--solid)) padding-box,var(--ring) border-box;animation:dl-ring 8s linear infinite;box-shadow:0 0 0 1px color-mix(in srgb,var(--g2) 18%,transparent),0 14px 44px color-mix(in srgb,var(--g3) 22%,transparent);overflow:visible}
:root[data-skin="aurora"] .lw{background:linear-gradient(135deg,color-mix(in srgb,var(--g3) 16%,var(--solid)),var(--solid)) padding-box,var(--ring) border-box;animation-duration:3s}
:root[data-skin="aurora"] .lw-k{color:var(--accent)}
:root[data-skin="aurora"] .hx .ring-txt{font-size:34px;font-weight:800;letter-spacing:-.03em}
:root[data-skin="aurora"] .hx-pct{font-weight:800}
:root[data-skin="aurora"] circle[stroke="var(--green)"]{stroke:url(#dl-grad);filter:drop-shadow(0 0 6px color-mix(in srgb,var(--g3) 55%,transparent))}
:root[data-skin="aurora"] .hx-next{background:var(--fill);border:.5px solid var(--sep)}
:root[data-skin="aurora"] .hx-ni{box-shadow:0 6px 16px color-mix(in srgb,var(--c,var(--g3)) 35%,transparent)}
:root[data-skin="aurora"] .hx-tick{border-color:var(--g3);color:var(--g4)}
:root[data-skin="aurora"] .pill{background:var(--fill);border:.5px solid var(--sep)}
/* buttons */
:root[data-skin="aurora"] .btn{background:var(--grad);color:var(--on-grad);border-radius:14px;font-weight:700;box-shadow:0 6px 20px color-mix(in srgb,var(--g3) 30%,transparent)}
:root[data-skin="aurora"] .btn:active{transform:scale(.97)}
:root[data-skin="aurora"] .btn.ghost{background:var(--fill);color:var(--accent);box-shadow:none;border:.5px solid var(--sep)}
:root[data-skin="aurora"] .btn.danger{background:transparent;box-shadow:none}
:root[data-skin="aurora"] .hx-add,:root[data-skin="aurora"] .qk.on{background:var(--grad);color:var(--on-grad);box-shadow:0 4px 14px color-mix(in srgb,var(--g3) 30%,transparent)}
:root[data-skin="aurora"] .ql-b i{box-shadow:0 6px 18px color-mix(in srgb,var(--c) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
/* week strip */
:root[data-skin="aurora"] .week .nav{color:var(--accent)}
:root[data-skin="aurora"] .dayb.today .n{color:var(--accent)}
:root[data-skin="aurora"] .dayb.sel .n{background:var(--fg);color:var(--bg)}
:root[data-skin="aurora"] .dayb.sel.today .n{background:var(--grad);color:var(--on-grad);box-shadow:0 0 0 3px color-mix(in srgb,var(--g2) 25%,transparent),0 6px 18px color-mix(in srgb,var(--g3) 45%,transparent)}
/* tasks */
:root[data-skin="aurora"] .task{min-height:64px}
:root[data-skin="aurora"] .check span{border-color:var(--fg3);border-width:2px}
:root[data-skin="aurora"] .check.on span{background:var(--grad);border-color:transparent;color:var(--on-grad);box-shadow:0 0 14px color-mix(in srgb,var(--g3) 55%,transparent)}
:root[data-skin="aurora"] .task .s .ok,:root[data-skin="aurora"] .task .time.at,:root[data-skin="aurora"] .tt-edit{color:var(--green)}
:root[data-skin="aurora"] .xtra{background:color-mix(in srgb,var(--g2) 22%,transparent);color:var(--accent)}
/* controls */
:root[data-skin="aurora"] .seg{background:var(--fill);border-radius:13px;padding:3px}
:root[data-skin="aurora"] .seg button{border-radius:10px}
:root[data-skin="aurora"] .seg button.on{box-shadow:0 2px 8px rgba(0,0,0,.12),0 0 0 .5px var(--sep)}
:root[data-skin="aurora"] input.f,:root[data-skin="aurora"] select.f,:root[data-skin="aurora"] textarea.f{border-radius:14px;background:var(--fill);border:.5px solid var(--sep);transition:box-shadow .2s,border-color .2s}
:root[data-skin="aurora"] input.f:focus,:root[data-skin="aurora"] select.f:focus,:root[data-skin="aurora"] textarea.f:focus{outline:none;border-color:color-mix(in srgb,var(--g3) 70%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--g3) 18%,transparent),0 0 24px color-mix(in srgb,var(--g3) 22%,transparent)}
:root[data-skin="aurora"] .opts input:checked+span{background:var(--grad);color:var(--on-grad)}
:root[data-skin="aurora"] .tgl:checked{background:linear-gradient(90deg,var(--g3),var(--g4))}
:root[data-skin="aurora"] .when,:root[data-skin="aurora"] .tgl-row{background:var(--fill);border:.5px solid var(--sep)}
:root[data-skin="aurora"] :focus-visible{outline-color:var(--g3)}
/* floating glass tab bar */
:root[data-skin="aurora"] body{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
:root[data-skin="aurora"] .tabbar{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:28px;border:.5px solid var(--edge);box-shadow:0 14px 40px rgba(0,0,0,.28),0 0 0 .5px var(--sep);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);max-width:520px;margin:0 auto}
:root[data-skin="aurora"] .tab{position:relative;color:var(--fg2);font-weight:600;border-radius:22px;min-height:52px;transition:color .2s}

tite, parvovirose, toux du chenil et leptospirose. Souvent faite chez l'éleveur : vérifiez le passeport.": "Štenećak, hepatitis, parvoviroza, kenelski kašalj i leptospiroza. Često se obavi kod uzgajivača: provjerite putovnicu.", "Deuxième injection du même vaccin, 3 à 4 semaines après la première.": "Druga doza istog cjepiva, 3 do 4 tjedna nakon prve.", "Troisième injection, recommandée pour bien protéger le chiot contre la parvovirose.": "Treća doza, preporučuje se za dobru zaštitu šteneta od parvoviroze.", "Obligatoire pour sortir de Suisse avec le chien. Elle se fait à partir de 12 semaines, au moins 21 jours avant le voyage.": "Obavezno za izlazak iz Švicarske s psom. Daje se od 12 tjedana, najmanje 21 dan prije putovanja.", "Rappel qui complète la vaccination de chiot.": "Docjepljivanje koje dovršava cijepljenje šteneta.", "La leptospirose se rappelle chaque année.": "Leptospiroza se docjepljuje svake godine.", "Carré, hépatite et parvovirose : un rappel tous les 3 ans suffit en général chez l'adulte.": "Štenećak, hepatitis i parvoviroza: kod odraslih obično je dovoljno docjepljivanje svake 3 godine.", "Toutes les 2 semaines jusqu'à 3 mois, puis chaque mois jusqu'à 6 mois, puis tous les 3 mois (plus souvent s'il mange des proies).": "Svaka 2 tjedna do 3 mjeseca, zatim mjesečno do 6 mjeseci, potom svaka 3 mjeseca (češće ako jede plijen).", "De mars à novembre, une protection contre les puces et les tiques chaque mois (ou selon le produit).": "Od ožujka do studenog zaštita od buha i krpelja svaki mjesec (ili prema proizvodu).", "Propreté": "Čistoća", "Sortez-le après chaque repas, sieste et jeu, et récompensez dehors tout de suite. Les accidents s'ignorent : on nettoie sans gronder.": "Izvedite ga nakon svakog obroka, drijemeža i igre te odmah nagradite vani. Nezgode ignorirajte: počistite bez grdnje.", "Répondre à son nom": "Odazivanje na ime", "Dites son nom d'une voix joyeuse et récompensez dès qu'il vous regarde. N'utilisez jamais son nom pour gronder.": "Veselo izgovorite ime i nagradite čim vas pogleda. Nikad ne koristite ime za grdnju.", "Socialisation": "Socijalizacija", "Surtout avant 4 mois : nouvelles personnes, chiens calmes, bruits, voiture, transports. Toujours à son rythme, sans le forcer.": "Osobito prije 4. mjeseca: novi ljudi, mirni psi, zvukovi, auto, prijevoz. Uvijek njegovim tempom, bez prisile.", "Manipulations": "Rukovanje", "Touchez pattes, oreilles et dents quelques secondes, puis récompensez. Les soins et le vétérinaire seront plus faciles.": "Dodirnite šape, uši i zube nekoliko sekundi pa nagradite. Njega i posjeti veterinaru bit će lakši.", "Assis": "Sjedni", "Tenez une friandise au-dessus de sa tête et reculez-la doucement : les fesses se posent, récompensez aussitôt. Ajoutez le mot ensuite.": "Držite poslasticu iznad glave i polako je pomaknite unatrag: stražnjica sjeda, odmah nagradite. Riječ dodajte poslije.", "Rappel (« viens »)": "Opoziv („dođi”)", "Accroupissez-vous, appelez joyeusement et faites la fête à chaque retour. Ne l'appelez jamais pour quelque chose de désagréable.": "Čučnite, veselo pozovite i slavite svaki povratak. Nikad ga ne zovite zbog nečeg neugodnog.", "Couché": "Lezi", "Depuis l'assis, descendez la friandise entre ses pattes puis glissez-la vers vous. Récompensez dès que les coudes touchent le sol.": "Iz sjedenja spustite poslasticu između šapa i povucite je prema sebi. Nagradite čim laktovi dotaknu pod.", "Marcher en laisse": "Hodanje na povodcu", "Arrêtez-vous dès que la laisse se tend, repartez quand elle se détend. Récompensez quand il marche à côté de vous.": "Stanite čim se povodac zategne, krenite kad se opusti. Nagradite kad hoda uz vas.", "Lâche": "Pusti", "Échangez l'objet contre une friandise en disant « lâche ». Rendez-lui souvent l'objet pour qu'il n'apprenne pas à le défendre.": "Zamijenite predmet za poslasticu govoreći „pusti”. Često mu ga vratite da ne nauči čuvati predmete.", "Aller au panier": "Na mjesto", "Lancez une friandise dans son panier et récompensez quand il s'y couche. C'est son coin calme, jamais une punition.": "Bacite poslasticu u njegov krevetić i nagradite kad legne. To je njegov mirni kutak, nikad kazna.", "Rester seul au calme": "Mirno ostati sam", "Partez quelques secondes, puis quelques minutes, sans grands adieux ni grandes retrouvailles. Un jouet à mâcher aide.": "Izađite na nekoliko sekundi, pa minuta, bez velikih oproštaja i dočeka. Pomaže igračka za žvakanje.", "Pas bouger": "Ostani", "Commencez par 2 secondes à un pas, revenez récompenser. Allongez la durée avant d'augmenter la distance.": "Počnite s 2 sekunde na jedan korak, vratite se i nagradite. Produžite trajanje prije udaljenosti.", "Laisse (ne touche pas)": "Ostavi", "Fermez la main sur une friandise ; dès qu'il s'écarte, récompensez avec l'autre main.": "Zatvorite šaku s poslasticom; čim se odmakne, nagradite drugom rukom.", "Donne la patte": "Daj šapu", "Attendez qu'il gratte la main fermée qui tient la friandise, puis ouvrez-la. Juste pour le plaisir !": "Pričekajte da šapom dotakne zatvorenu ruku s poslasticom, pa je otvorite. Samo iz zabave!", "À apprendre": "Za naučiti", "Acquis": "Naučeno", "Pipi, caca, balade chronométrée, accident, photo… Un toucher suffit : l'heure et votre prénom sont notés.": "Piš, kakica, šetnja s mjeračem, nezgoda, fotografija… Dovoljan je jedan dodir: vrijeme i vaše ime se spremaju.", "La routine de la semaine et les rendez-vous. Choisissez qui s'occupe de quoi.": "Tjedna rutina i termini. Odaberite tko je za što zadužen.", "Traitements, vaccins, croissance, propreté, croquettes et résumé pour le vétérinaire.": "Terapije, cijepljenja, rast, čistoća, granule i sažetak za veterinara.", "Qui fait quoi, les messages, les invitations et la garde. C'est aussi ici qu'on rejoint ou quitte la famille.": "Tko što radi, poruke, pozivnice i čuvanje. Ovdje se i pridružujete obitelji ili je napuštate.", "Sa fiche, son compagnon 3D, l'éducation, vos autres chiens et les réglages.": "Profil, 3D prijatelj, dresura, v
