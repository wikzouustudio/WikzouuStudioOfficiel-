.g-msg{background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--fg);border-radius:12px;padding:10px 12px;font-size:15px;text-align:left}
.g-links{display:flex;justify-content:center;gap:18px;margin-top:6px}.g-links button{background:none;border:0;color:var(--accent);font:inherit;font-size:15px;cursor:pointer}
.g-fine{color:var(--fg3);font-size:12px;margin-top:10px}

.g-card:active{transform:scale(.98)}.g-card span:last-child{display:flex;flex-direction:column;gap:3px}.g-card b{font-size:17px}.g-card small{font-size:14px;color:var(--fg2)}
.g-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.g-spin{width:28px;height:28px;margin:20px auto;border-radius:50%;border:3px solid var(--fill2);border-top-color:var(--accent);animation:sp .8s linear infinite}
